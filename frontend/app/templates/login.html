{% extends "base.html" %}
{% block title %}Iniciar Sesión — UGL{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card card anim-slide-up">
        <div class="auth-brand">
            <span class="auth-brand-name">⚽ UGL</span>
        </div>
        <div class="auth-divider"></div>
        <h1 class="auth-title">Bienvenido</h1>
        <p class="auth-subtitle">Accede a la liga privada de fútbol sala</p>

        {% if error %}
        <div class="form-error">⚠ {{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="tu@correo.com" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-full">Entrar</button>
        </form>
    </div>
</div>
{% endblock %}
