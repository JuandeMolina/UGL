{% extends "base.html" %}
{% block title %}Editar Perfil — {{ player.name }}{% endblock %}

{% block content %}
<div class="dash-wrapper" style="max-width: 600px;">

    <div class="anim-slide-up" style="margin-bottom: 24px;">
        <a href="{{ url_for('main.player_detail', player_id=player.id) }}" class="btn btn-ghost btn-sm">← Volver al Perfil</a>
    </div>

    <div class="dash-page-header anim-slide-up">
        <p class="eyebrow">Administración</p>
        <h2>Editar Perfil</h2>
        <p>Actualiza la información personal de {{ player.name }}.</p>
    </div>

    <div class="card anim-slide-up anim-delay-1" style="padding: 32px;">
        <form method="POST" class="admin-form">

            <div class="form-group">
                <label for="jersey_number">Dorsal</label>
                <input type="number" id="jersey_number" name="jersey_number" value="{{ player.jersey_number or '' }}" placeholder="Ej: 10">
            </div>

            <div class="form-group">
                <label for="photo_url">URL de la Foto</label>
                <input type="url" id="photo_url" name="photo_url" value="{{ player.photo_url or '' }}" placeholder="https://ejemplo.com/foto.jpg">
            </div>

            <div class="form-group">
                <label for="description">Descripción / Biografía</label>
                <textarea id="description" name="description" rows="5" class="form-textarea" placeholder="Breve texto sobre el jugador...">{{ player.description or '' }}</textarea>
            </div>

            <div style="margin-top: 32px;">
                <button type="submit" class="btn btn-primary" style="width: 100%;">Guardar Cambios</button>
            </div>

        </form>
    </div>

</div>

<style>
    .admin-form { display: flex; flex-direction: column; gap: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 8px; }
    .form-group label { font-size: 0.88rem; font-weight: 700; color: var(--text-dark); }
    .form-group input, .form-textarea { padding: 12px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #fff; font-size: 0.95rem; color: var(--text-dark); transition: border-color .2s, box-shadow .2s; }
    .form-textarea { resize: vertical; min-height: 120px; font-family: inherit; }
    .form-group input:focus, .form-textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
</style>
{% endblock %}
